[project]
name = "glyfit"
version = "0.1.0"
description = "Glyph fitting using gradient-free optimization"
requires-python = ">=3.11"
dependencies = [
    "torch",
    "fonttools",
    "pycairo",
    "numpy",
    "pillow",
    "rich>=14.2.0",
    "loguru>=0.7.3",
    "matplotlib>=3.10.7",
    "maturin>=1.10.2",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "pytest",
    "mypy",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/glyfit"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]
